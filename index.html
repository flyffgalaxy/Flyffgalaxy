<!DOCTYPE html>
<html>
<head>
  <title>Flyff Galaxy Web</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } 
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDzNp6ZXv1KcQR5YK7RCWL5fiOWAAhS8NM",
      authDomain: "flyffgalaxy.firebaseapp.com",
      projectId: "flyffgalaxy",
      storageBucket: "flyffgalaxy.firebasestorage.app",
      messagingSenderId: "957266144921",
      appId: "1:957266144921:web:615b297948b643f8401208",
      measurementId: "G-3E1VNME1K2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Register new account
    async function register() {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      const user = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, "players", user.user.uid), {
        hp: 100, mp: 50, exp: 0, level: 1, points: 0
      });
      alert("Account created!");
    }

    // Login existing account
    async function login() {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      const user = await signInWithEmailAndPassword(auth, email, pass);
      const snap = await getDoc(doc(db, "players", user.user.uid));
      if (snap.exists()) {
        alert("Welcome back! Level: " + snap.data().level);
      }
    }
  </script>
</head>
<body>
  <h1>Flyff Galaxy Web</h1>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>

  <canvas id="gameCanvas" width="400" height="300" style="border:1px solid black;"></canvas>
  <script>
    const ctx = document.getElementById("gameCanvas").getContext("2d");
    ctx.fillStyle = "purple";
    ctx.fillRect(50, 50, 50, 50); // simple "character"
  </script>
</body>
</html>
